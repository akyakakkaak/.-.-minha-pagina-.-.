<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre Mim ~ Cinnamoroll 🎀</title>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --cor-primaria: #89cff0;
            --cor-secundaria: #ffb6c1;
            --cor-fundo: #f0f8ff;
            --cor-card: #ffffff;
            --cor-texto: #5a738e;
            --borda-fofa: #b0e0e6;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Fredoka', sans-serif; }
        body { background-color: var(--cor-fundo); color: var(--cor-texto); padding: 2rem; text-align: center; }
        
        .card {
            background: var(--cor-card);
            border: 4px solid var(--borda-fofa);
            border-radius: 30px;
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
        }
        h1 { color: var(--cor-primaria); margin-bottom: 1rem; }
        a.btn-voltar {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.6rem 1.2rem;
            background: var(--cor-secundaria);
            color: white;
            text-decoration: none;
            border-radius: 20px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Sobre Mim ☁️✨</h1>
        <p>Esta é a minha segunda página! Aqui posso contar mais sobre minhas paixões, meus hobbies favoritos e meus projetos futuros.</p>
        
        <!-- Botão para voltar à página principal -->
        <a href="index.html" class="btn-voltar">👈 Voltar para o Início</a>
    </div>
</body>
</html>
